# Production hosting is on Vercel. This config makes Netlify Deploy Previews
# (and the Header/Pages/Redirect PR checks) work for the Next.js App Router
# after the Astro → Next.js migration.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Prefer the native Function for estimate saves so Netlify Blobs context is available.
# force=true beats the Next.js Runtime's /api rewrite. Vercel ignores this file.
[[redirects]]
  from = "/api/estimate"
  to = "/.netlify/functions/estimate"
  status = 200
  force = true
